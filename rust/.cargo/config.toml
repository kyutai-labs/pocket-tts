# xn picks its int8 SIMD kernels at compile time (the f32 matmuls are dispatched at runtime).
# x86-64-v3 (AVX2, FMA: Intel Haswell and AMD Zen onwards) is the baseline the released x86
# binaries are built for; aarch64 always has NEON. The release workflow also builds `-v2`
# archives (x86-64-v2) for older CPUs, by overriding these flags with RUSTFLAGS.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
