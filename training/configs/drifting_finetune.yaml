# Drifting teacher, stage 2 of 2: resume the stage-1 run (same run_dir) at a
# low, annealed learning rate with the kernel temperature frozen at the value
# stage 1 learned (it is restored from the checkpoint). On LibriSpeech this
# took the teacher from 4.26 to 4.29 UTMOS and 1.01% to 0.98% WER.
#
# Run it after drifting.yaml has written checkpoint_00400000.pt: training
# resumes from the latest checkpoint in run_dir. warmup_steps equals the resume
# step so the cosine spans exactly steps 400k -> 500k (the linear warmup is
# never reached).
model_config: pocket_tts/config/english.yaml
model_overrides:
  flow_lm.transformer.num_layers: 24
start_from_pretrained: false

data:
  train_jsonl: data/hifitts2_200h/train_aligned.jsonl
  valid_jsonl: data/hifitts2_200h/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: drifting
  kwargs:
    temp_loss_weight: 0.0
    num_neg: 64

flow_batch_multiplier: 1
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-5
  schedule: cosine
  warmup_steps: 400000
  lr_min_ratio: 0.0
  betas: [0.9, 0.999]
  weight_decay: 0.0
  max_norm: 3.0

run_dir: runs/drifting
batch_size: 128
grad_accum_steps: 1
max_steps: 500000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 5000
num_ckpt_keep: 3
sample_cfg_coef: 2.0
