name: Bless audio reference (temporary)

# One-off helper to record rust/tests/reference/english-int8.wav on the same kind of runner
# run-tests.yml's `rust` job uses, so the reference matches what CI actually produces instead of
# whatever OS a contributor happened to run `cargo test` on. Remove this file once the reference
# is committed.

on:
  workflow_dispatch:

jobs:
  bless:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Remove the stale reference so it gets recorded fresh
        run: rm -f tests/reference/english-int8.wav
      - name: Record english-int8.wav
        env:
          POCKET_TTS_BLESS: "1"
        run: |
          cargo test --release --locked --test audio_regression -- --ignored \
            the_quantized_backend_still_sounds_the_same
      - uses: actions/upload-artifact@v4
        with:
          name: english-int8-wav
          path: rust/tests/reference/english-int8.wav
          if-no-files-found: error
