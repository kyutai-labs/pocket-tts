[package]
name = "pocket-tts-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The pocket-speak engine for the Android app, over JNI"

[lib]
name = "pocket_tts_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-22"] }
pocket-tts-engine = { path = "../engine", default-features = false, features = ["load-dynamic"] }
