[package]
name = "pocket-tts-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pocket TTS on ONNX Runtime: text preparation, chunking and synthesis"

[dependencies]
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "preload-dylibs"] }
safetensors = "0.8"
sentencepiece-rs = "=0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The desk downloads ONNX Runtime at build time and copies it beside the
# binary. Android cannot: the app ships Microsoft's `onnxruntime-android`
# library and the JNI crate opens it by path, which is `load-dynamic`.
[features]
default = ["download-binaries"]
download-binaries = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-rustls"]
load-dynamic = ["ort/load-dynamic"]
