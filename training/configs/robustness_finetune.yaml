# Robustness fine-tune of a released teacher: voice prompts that end mid-word and
# text without a final punctuation mark stay in distribution. The sampler head is
# frozen so a student distilled from this teacher keeps its latent geometry
# (robustness_redistill.yaml). 5k steps already close most of the gap; 30k is
# the released setting. On the released english_2026-04_24l teacher and
# LibriSpeech prompts cut mid-word this took WER from 1.25% to 0.99% with equal
# intact-prompt WER and UTMOS.
model_config: pocket_tts/config/english_2026-04_24l.yaml
start_from_pretrained: true
freeze_head: true

data:
  train_jsonl: data/train_aligned.jsonl
  valid_jsonl: data/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 0.0  # any word boundary can end the prompt (no 5 s window)
  prompt_trim_max_sec: 0.5
  final_punct_dropout: 0.3

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-5
  schedule: constant
  warmup_steps: 1000

run_dir: runs/robustness_finetune
batch_size: 64  # effective batch: 16 per GPU on 4 GPUs
grad_accum_steps: 1
max_steps: 30000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 5000
ckpt_freq: 5000
num_ckpt_keep: 6
sample_cfg_coef: 2.0
