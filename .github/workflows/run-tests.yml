name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.0

  ty:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync --dev -p ${{ matrix.python-version }}
    - name: Run ty
      run: uv run -p ${{ matrix.python-version }} ty check

  rust:
    runs-on: ubuntu-latest
    needs: pre-commit
    defaults:
      run:
        working-directory: rust
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --release --locked --all-targets -- -D warnings
    - name: Unit tests
      run: cargo test --release --locked
    - name: Generate speech
      run: |
        cargo run --release --locked -- generate --text "Hello world." --output-path hello.wav
        echo "Hello world." | cargo run --release --locked -- generate --text - --output-path - --voice marius -q > stdout.wav
        for f in hello.wav stdout.wav; do
          size=$(stat -c %s "$f")
          if [ "$size" -lt 50000 ]; then echo "::error::$f is only $size bytes"; exit 1; fi
        done

  pytest:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync --dev -p ${{ matrix.python-version }}
    - name: Run pytest
      run: |
        uv run -p ${{ matrix.python-version }} pytest -v ./tests ./training/tests
