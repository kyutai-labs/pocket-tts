# Re-distill a released student from a robustness-fine-tuned teacher
# (robustness_finetune.yaml). The student's backbone starts from the released
# weights and regresses the new teacher's activations under the same prompt
# augmentations; the per-frame heads come from the teacher, which kept them
# frozen, so the student's head is unchanged. 30k steps at 4e-5 gave
# english_2026-09: mid-word-cut prompt WER 1.17% -> 0.89%, intact WER and UTMOS
# unchanged (human preference tied with the released model, 207-193).
model_config: pocket_tts/config/english.yaml
start_from_pretrained: false
student_init_from: hf://kyutai/pocket-tts/languages/english_2026-04/model.safetensors
distill_cfg_coef: 2.0
distill_teacher_config: pocket_tts/config/english_2026-04_24l.yaml
distill_teacher_weights: runs/robustness_finetune/checkpoint_00030000.pt

data:
  train_jsonl: data/train_aligned.jsonl
  valid_jsonl: data/valid_aligned.jsonl
  max_voice_prompt_sec: 0.0
  prompt_trim_max_sec: 0.5
  final_punct_dropout: 0.3

flow:
  type: lsd
  kwargs: {}

text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-5
  schedule: constant
  warmup_steps: 1000

run_dir: runs/robustness_redistill
batch_size: 64  # effective batch: 16 per GPU on 4 GPUs
grad_accum_steps: 1
max_steps: 30000
ema_decay: 0.999
log_freq: 50
valid_freq: 5000
ckpt_freq: 5000
num_ckpt_keep: 6
