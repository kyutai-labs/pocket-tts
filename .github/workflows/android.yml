name: Android

# The engine compiles in upstream's rust/src and embeds pocket_tts/config, so
# an upstream merge that changes either runs this too.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'pocket-speak/**'
      - 'rust/src/**'
      - 'rust/Cargo.toml'
      - 'pocket_tts/config/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'pocket-speak/**'
      - 'rust/src/**'
      - 'rust/Cargo.toml'
      - 'pocket_tts/config/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  # The engine and the desk CLI on their own: format, lints, and unit tests,
  # upstream's own tests of the modules the engine compiles in among them.
  engine:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: pocket-speak
    # cpal, the desk CLI's audio output, links ALSA.
    - run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
    - name: Format
      working-directory: pocket-speak
      run: cargo fmt --all --check
    - name: Lints
      working-directory: pocket-speak
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Tests
      working-directory: pocket-speak
      run: cargo test --workspace

  # Every offered model on an arm64 CPU, the architecture of every phone this
  # app is meant for: the engine's tests against each, then its speed, the
  # numbers the default model is chosen from, as a table in the run's summary.
  models-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: pocket-speak
    - uses: actions/cache@v4
      with:
        path: ~/models
        key: models-${{ hashFiles('pocket-speak/models.json') }}
    - name: Fetch the models
      run: python3 pocket-speak/tools/fetch-models.py ~/models
    - name: Tests with the models
      working-directory: pocket-speak
      run: POCKET_TTS_TEST_MODELS="$HOME/models" cargo test --release -p pocket-tts-engine --test with_models
    - name: Measure
      run: |
        lscpu | grep -E 'Model name|^CPU\(s\)' | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
        echo >> "$GITHUB_STEP_SUMMARY"
        pocket-speak/tools/bench/run.sh ~/models 1 2 4 | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    # Write access is for the release step below, which only runs on main.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    # The action's default package list includes `tools`, which current
    # cmdline-tools no longer resolve, so sdkmanager exits 1 before anything
    # builds. platform-tools is all the default list added that still exists.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    # The APK carries pocket-speak's engine, which Gradle's buildNative task
    # compiles from ../pocket-speak with cargo-ndk: all of the app's native code. The runner image ships an NDK;
    # cargo-ndk finds it through ANDROID_NDK_HOME.
    - name: Set up Rust for Android
      run: |
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: pocket-speak
    - name: Install cargo-ndk
      run: cargo install --locked cargo-ndk
    # Gradle would run this itself before the first task below; doing it as
    # its own step puts a Rust failure under a Rust heading. Later Gradle
    # steps find the libraries current and cargo does nothing.
    - name: Build the engine for each ABI
      working-directory: android
      run: ./gradlew --no-daemon :app:buildNative
    - name: Run unit tests
      working-directory: android
      run: ./gradlew --no-daemon :app:testDebugUnitTest
    # The class of bug lint sees and nothing else here does: an API newer than
    # minSdk. It compiles, every test passes - they run on a modern SDK - and it
    # breaks only on the oldest phones this app claims to support, which are the
    # ones least likely to be in the room. One was already shipping: the crash
    # reporter read the app version with an API 28 call, swallowed the
    # NoSuchMethodError on Android 8, and reported "unknown" for the one field a
    # crash report most needs.
    - name: Lint
      working-directory: android
      run: ./gradlew --no-daemon :app:lintDebug
    - name: Upload the lint report when it fails
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report-${{ github.run_number }}
        path: android/app/build/reports/lint-results-debug.html
        if-no-files-found: ignore

    - name: Build debug APK
      working-directory: android
      run: ./gradlew --no-daemon :app:assembleDebug

    # R8 is the part of the build nothing else here sees, and it has already
    # deleted the JNI audio callback once - silently, in a build that compiled
    # and passed every test. Build it and check the artefact, not the source.
    - name: Build release APK
      working-directory: android
      run: ./gradlew --no-daemon :app:assembleRelease

    - name: Check the JNI methods the engine calls survived shrinking
      working-directory: android
      run: |
        ./tools/check-jni-callback.sh app/build/outputs/apk/debug/app-debug.apk
        ./tools/check-jni-callback.sh app/build/outputs/apk/release/app-release.apk

    # An APK without the engine installs, opens, and fails on the first read.
    - name: Check the engine is packaged for every ABI
      working-directory: android/app/build/outputs/apk
      run: |
        for apk in debug/app-debug.apk release/app-release.apk; do
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libpocket_tts_jni.so" \
              || { echo "$apk has no lib/$abi/libpocket_tts_jni.so"; exit 1; }
          done
        done

    # A runner has no ~/.android/debug.keystore, so before the key was
    # committed the plugin generated a new one per run and every artefact this
    # workflow uploaded was a different app as far as a phone is concerned:
    # uninstall-only, and refused outright by a device that kept its data. That
    # is a property of the artefact, invisible in the build file, and it
    # regresses the moment the keystore goes missing from a checkout.
    - name: Check the APKs are signed by the committed key
      working-directory: android
      run: |
        ./tools/check-signing.sh app/build/outputs/apk/debug/app-debug.apk
        ./tools/check-signing.sh app/build/outputs/apk/release/app-release.apk

    # Every run of this workflow uploads an APK. Without the commit in the
    # name they are indistinguishable in the Actions list, and it is very easy
    # to sideload a stale build and conclude a fix did not work.
    - name: Label this build
      id: label
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: echo "tag=${GITHUB_RUN_NUMBER}-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: pocket-tts-debug-apk-${{ steps.label.outputs.tag }}
        path: android/app/build/outputs/apk/debug/*.apk

    # Worth sideloading too: the release build is the one that runs shrunk and
    # optimised, and until now it had never been installed on anything.
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: pocket-tts-release-apk-${{ steps.label.outputs.tag }}
        path: android/app/build/outputs/apk/release/*.apk

    # Artifacts expire and need a GitHub login to download. A release is a
    # link a phone's browser can open. One per build of main, each tagged with
    # the label above, and the newest marked latest so
    # /releases/latest/download/pocket-tts.apk always points at it.
    - name: Publish the release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: android-${{ steps.label.outputs.tag }}
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk pocket-tts.apk
        gh release create "$TAG" pocket-tts.apk \
          --target "$GITHUB_SHA" \
          --title "Android $TAG" \
          --notes "Release APK built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
          --latest

    # One release per build of main adds up. The newest ten are kept, which is
    # far more than anyone rolls back through; older android-* releases go,
    # with their tags. Nothing else is touched: only tags this step made.
    - name: Keep the ten newest APK releases
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release list --limit 200 --json tagName,createdAt \
          --jq '[.[] | select(.tagName | startswith("android-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
        while read -r tag; do
          echo "deleting $tag"
          gh release delete "$tag" --cleanup-tag --yes
        done
